name: Publish Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build wheels (${{ matrix.os }} ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          # macos-14 runners were retired. macos-15 is the oldest supported
          # image, closest to the toolchain that built the working 0.1.0.
          - os: macos-15
            target: aarch64
          - os: macos-15
            target: x86_64
          # Without Windows wheels, pip falls back to the sdist and needs the
          # Rust toolchain plus the MSVC linker (Visual C++ Build Tools).
          - os: windows-latest
            target: x64
          - os: windows-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: python
          manylinux: auto
      # Refuse to publish a wheel that cannot be imported. Newer Apple linkers
      # can emit extension modules that dyld rejects ("mis-aligned LINKEDIT
      # string pool"); a failing import here fails the job, which skips the
      # publish job. Only native targets can be imported on the build runner.
      - name: Smoke-test the wheel
        if: (runner.os == 'macOS' && matrix.target == 'aarch64') || (runner.os == 'Linux' && matrix.target == 'x86_64') || (runner.os == 'Windows' && matrix.target == 'x64')
        shell: bash
        run: |
          python -m pip install --no-index --find-links python/dist eggdb
          python -c "import eggdb; print('imported eggdb', eggdb.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: python/dist

  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: python
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist

  publish:
    name: Publish to PyPI
    needs: [build, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

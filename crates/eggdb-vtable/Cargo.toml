[package]
name = "eggdb-vtable"
version = "0.2.0"
edition = "2021"
description = "SQLite virtual table extension for querying .egg files"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Nazareneism/eggdb"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
loadable_extension = ["rusqlite/loadable_extension"]

[dependencies]
eggdb-core = { path = "../eggdb-core" }
eggdb-store = { path = "../eggdb-store" }
rusqlite = { workspace = true }
bitvec = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
tempfile = "3"
eggdb-io = { path = "../eggdb-io" }

[package]
name = "eggdb-python"
version = "0.2.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "_eggdb"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39", "generate-import-lib"] }
eggdb-core = { path = "../crates/eggdb-core" }
eggdb-store = { path = "../crates/eggdb-store" }
eggdb-vtable = { path = "../crates/eggdb-vtable" }
eggdb-yql = { path = "../crates/eggdb-yql" }
rusqlite = { version = "=0.40.2", features = ["bundled", "vtab"] }
zeroize = "1"
